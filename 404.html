<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages SPA redirect trick
      // Saves the full URL to sessionStorage then redirects to the base
      sessionStorage.redirect = location.href;
      location.replace(
        location.origin + '/navataga-fashions/' +
        location.search + location.hash
      );
    </script>
  </head>
  <body></body>
</html>
